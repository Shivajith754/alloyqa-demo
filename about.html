<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About Us — Launchpad</title>
  <meta
    name="description"
    content="Learn more about Launchpad."
  />

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      color: #161616;
      background: #fafafa;
      line-height: 1.5;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
    }

    header {
      border-bottom: 1px solid #e8e8e8;
      background: rgba(250, 250, 250, 0.92);
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(12px);
    }

    nav {
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
      font-size: 14px;
      color: #5f5f5f;
    }

    .menu-toggle {
      display: none;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid #d8d8d8;
      border-radius: 10px;
      background: white;
      color: #171717;
      cursor: pointer;
    }

    .menu-toggle svg {
      width: 20px;
      height: 20px;
    }

    .mobile-menu {
      display: none;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 20px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    .button:hover {
      transform: translateY(-1px);
    }

    .button-primary {
      background: #171717;
      color: white;
    }

    .button-secondary {
      border: 1px solid #d8d8d8;
      background: white;
    }

    .hero {
      padding: 120px 0 100px;
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      padding: 7px 12px;
      border: 1px solid #dddddd;
      border-radius: 999px;
      background: white;
      font-size: 13px;
      color: #616161;
      margin-bottom: 28px;
    }

    h1 {
      max-width: 820px;
      margin: 0 auto;
      font-size: clamp(48px, 7vw, 80px);
      line-height: 1;
      letter-spacing: -0.055em;
      font-weight: 750;
    }

    .hero p {
      max-width: 620px;
      margin: 28px auto 0;
      font-size: 19px;
      color: #666;
    }

    footer {
      border-top: 1px solid #e8e8e8;
      padding: 32px 0;
      color: #777;
      font-size: 14px;
    }

    .footer-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .footer-links {
      display: flex;
      gap: 22px;
    }

    @media (max-width: 760px) {
      nav {
        gap: 12px;
      }

      .nav-links {
        display: none;
      }

      .menu-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .mobile-menu {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
        padding: 0 0 16px;
      }

      .mobile-menu.open {
        display: grid;
      }

      .mobile-menu a {
        padding: 12px;
        border: 1px solid #e3e3e3;
        border-radius: 10px;
        background: white;
        color: #5f5f5f;
        font-size: 14px;
        text-align: center;
      }

      .hero {
        padding: 90px 0 70px;
      }

      .footer-content {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="container">
      <nav>
        <a class="brand" href="index.html">Launchpad</a>

        <div class="nav-links">
          <a href="index.html#features">Features</a>
          <a href="index.html#pricing">Pricing</a>
          <a href="index.html#faq">FAQ</a>
          <a href="about.html">About</a>
          <a href="index.html#contact">Contact</a>
        </div>

        <button
          class="menu-toggle"
          type="button"
          aria-controls="mobile-menu"
          aria-expanded="false"
          aria-label="Open navigation menu"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        </button>

        <a class="button button-primary" href="index.html#get-started">
          Get started
        </a>
      </nav>

      <div class="mobile-menu" id="mobile-menu" aria-label="Mobile navigation">
        <a href="index.html#features">Features</a>
        <a href="index.html#pricing">Pricing</a>
        <a href="about.html">About</a>
        <a href="index.html#contact">Contact</a>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <div class="eyebrow">About Us</div>
        <h1>About Launchpad</h1>
        <p>made by launchpad</p>
      </div>
    </section>
  </main>

  <footer id="contact">
    <div class="container footer-content">
      <div>© 2026 Launchpad</div>

      <div class="footer-links">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="index.html#contact">Contact</a>
      </div>
    </div>
  </footer>

  <script>
    const menuToggle = document.querySelector(".menu-toggle");
    const mobileMenu = document.querySelector(".mobile-menu");

    menuToggle.addEventListener("click", () => {
      const isOpen = mobileMenu.classList.toggle("open");
      menuToggle.setAttribute("aria-expanded", isOpen);
      menuToggle.setAttribute(
        "aria-label",
        isOpen ? "Close navigation menu" : "Open navigation menu"
      );
    });

    mobileMenu.querySelectorAll("a").forEach((link) => {
      link.addEventListener("click", () => {
        mobileMenu.classList.remove("open");
        menuToggle.setAttribute("aria-expanded", "false");
        menuToggle.setAttribute("aria-label", "Open navigation menu");
      });
    });
  </script>
</body>
</html>
